<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="清晨厨房插画">
  <!-- 原创插画：Swiss 风格的清晨厨房，几何形状构成 -->
  <rect width="960" height="540" fill="#17171b"/>
  <!-- 地面 -->
  <rect y="430" width="960" height="110" fill="#202027"/>
  <!-- 窗户：清晨的天色 -->
  <rect x="90" y="70" width="260" height="220" fill="#23232a" stroke="#c9c9d2" stroke-width="3"/>
  <rect x="96" y="76" width="248" height="208" fill="#3b2a24"/>
  <circle cx="170" cy="150" r="34" fill="#ff3355"/>
  <line x1="220" y1="76" x2="220" y2="284" stroke="#c9c9d2" stroke-width="3"/>
  <line x1="96" y1="180" x2="344" y2="180" stroke="#c9c9d2" stroke-width="3"/>
  <!-- 橱柜台面 -->
  <rect x="420" y="300" width="450" height="18" fill="#c9c9d2"/>
  <rect x="430" y="318" width="430" height="112" fill="#23232a" stroke="#c9c9d2" stroke-width="3"/>
  <line x1="645" y1="318" x2="645" y2="430" stroke="#c9c9d2" stroke-width="3"/>
  <circle cx="620" cy="374" r="6" fill="#c9c9d2"/>
  <circle cx="670" cy="374" r="6" fill="#c9c9d2"/>
  <!-- 水壶 -->
  <rect x="480" y="240" width="70" height="60" fill="#23232a" stroke="#c9c9d2" stroke-width="3"/>
  <path d="M550 255 L578 262 L578 282 L550 290 Z" fill="#23232a" stroke="#c9c9d2" stroke-width="3"/>
  <path d="M488 240 Q515 212 542 240" fill="none" stroke="#c9c9d2" stroke-width="3"/>
  <!-- 蒸汽 -->
  <path d="M505 222 q6 -10 0 -20 q-6 -10 0 -20" fill="none" stroke="#7a7a84" stroke-width="3" stroke-linecap="round"/>
  <path d="M528 222 q6 -10 0 -20 q-6 -10 0 -20" fill="none" stroke="#7a7a84" stroke-width="3" stroke-linecap="round"/>
  <!-- 杯子 -->
  <rect x="700" y="262" width="44" height="38" fill="#23232a" stroke="#c9c9d2" stroke-width="3"/>
  <path d="M744 270 h14 a10 10 0 0 1 0 22 h-14" fill="none" stroke="#c9c9d2" stroke-width="3"/>
  <!-- 餐桌与早餐 -->
  <rect x="120" y="360" width="240" height="14" fill="#c9c9d2"/>
  <rect x="140" y="374" width="14" height="90" fill="#c9c9d2"/>
  <rect x="326" y="374" width="14" height="90" fill="#c9c9d2"/>
  <ellipse cx="240" cy="352" rx="52" ry="12" fill="#23232a" stroke="#c9c9d2" stroke-width="3"/>
  <circle cx="240" cy="344" r="14" fill="#ff3355"/>
  <!-- 挂钟：接近八点 -->
  <circle cx="620" cy="130" r="46" fill="#23232a" stroke="#c9c9d2" stroke-width="3"/>
  <line x1="620" y1="130" x2="620" y2="96" stroke="#c9c9d2" stroke-width="4" stroke-linecap="round"/>
  <line x1="620" y1="130" x2="592" y2="148" stroke="#ff3355" stroke-width="4" stroke-linecap="round"/>
  <circle cx="620" cy="130" r="4" fill="#c9c9d2"/>
</svg>
